# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/docker-agent/main/agent-schema.json

version: "16"

permissions:
  deny:
    - shell

runtime:
  sandbox: true
  safety: restricted

agents:
  root:
    model: openai/gpt-5-mini
    description: Read-only reviewer confined to the working directory
    instruction: |
      Inspect files inside the working directory and report findings with exact paths.
      Do not modify files or execute shell commands.
    toolsets:
      - type: filesystem
        readonly: true
        allow_list:
          - .
      - type: think
